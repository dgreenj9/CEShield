name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test (scoring logic + dataset integrity)
        run: npm test

      - name: Catalog importer and review workflow tests
        run: |
          python3 -m unittest discover -s scripts/catalog -p 'test_*.py'
          node scripts/catalog/test-review.mjs

      # Build with placeholder Supabase env so the static build succeeds in CI
      # without exposing real keys. Runtime keys are injected by Vercel.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
